<svg xmlns="http://www.w3.org/2000/svg" width="694" viewBox="0 0 694 223" role="img" aria-labelledby="title desc">
<title id="title">Java 责任链：成功请求的进入与返回</title>
<desc id="desc">成功请求依次进入日志、鉴权、校验与业务处理；业务产生结果后，按调用栈经校验、鉴权、日志返回调用者。</desc>
